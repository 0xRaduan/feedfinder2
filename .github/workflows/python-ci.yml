name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync # Assuming uv sync will pick up dev dependencies from pyproject.toml

    - name: Lint with ruff
      run: |
        uv run ruff check .

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .

    - name: Test with unittest
      run: |
        uv run python -m unittest test_feedfinder2.py
